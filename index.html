<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <style>
        :root {
    --bg-day: #e8f5e9; --bg-night: #1a2a1a;
    --primary-green: #81c784; --primary-flower: #f48fb1;
}

/* 🌟 全域優化：禁用 iOS 長按選單，提升遊戲感 */
* { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    
    /* 🚫 禁用長按與選取內容 (遊戲體驗優化) */
    -webkit-touch-callout: none;    /* iOS Safari 專用：禁用長按選單 */
    -webkit-user-select: none;      /* Safari, Chrome, Opera 舊版 */
    -moz-user-select: none;         /* Firefox 專用 */
    -ms-user-select: none;          /* Internet Explorer/Edge 舊版 */
    user-select: none;              /* 標準屬性：支援所有現代瀏覽器 */
}

/* 🔓 確保輸入框、文字區域與可編輯內容仍可選取文字 */
input, textarea, [contenteditable="true"] { 
    -webkit-user-select: text; 
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text; 
}

body {
    margin: 0; padding: 0; font-family: "PingFang TC", sans-serif;
    transition: background 1s; 
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; 
    height: 100vh;
    /* 🌟 適應 iOS 安全區域 (防止內容被瀏海或底條遮住) */
    padding-top: env(safe-area-inset-top);
}

/* 背景裝飾 */
.day { background: var(--bg-day); color: #2e7d32; }
.night { background: var(--bg-night); color: #a5d6a7; }

/* 🌟 底部按鈕區優化：自動避開 iPhone 底部的小白條 */
.controls { 
    padding: 10px 20px;
    padding-bottom: calc(30px + env(safe-area-inset-bottom)); 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 10px; 
    width: 100%; 
    max-width: 400px; 
}

.decoration-emoji {
    position: fixed; /* 改用 fixed 確保滾動時位置不變 */
    pointer-events: none;
    z-index: 1;
    user-select: none;
}

/* 櫻花漂浮感 (白天) */
@keyframes sakuraFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(15deg); }
}

/* 星星呼吸感 (夜晚) */
@keyframes starBlink {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
}

        /* 進度條 */
        #top-bar { width: 100%; padding: 15px 20px 5px; max-width: 400px; z-index: 10; }
        .progress-container { width: 100%; height: 12px; background: rgba(0,0,0,0.1); border-radius: 6px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--primary-green); transition: width 0.5s; }
        .level-text { font-size: 12px; margin-top: 5px; display: flex; justify-content: space-between; font-weight: bold; }

        /* 核心遊戲區 */
        #game-container { position: relative; flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        #flower-pot { width: 200px; height: 200px; cursor: pointer; transition: transform 0.3s; position: relative; z-index: 5; }
        #flower-pot:active { transform: scale(0.95); }
        #flower-img { width: 100%; height: 100%; object-fit: contain; }
        #growth-timer { position: absolute; top: -35px; width: 100%; text-align: center; font-weight: bold; font-size: 20px; color: #ff8a80; }

        #message-bubble {
    position: absolute;
    top: 12%;                /* 稍微往下一點點，視覺上比較平衡 */
    left: 50%;               /* 搭配 transform 讓它水平居中 */
    transform: translateX(-50%); 
    
    background: rgba(255, 255, 255, 0.95); /* 加一點微透明感，更有質感 */
    color: #444;             /* 稍微深灰，讀起來比純黑更溫柔 */
    padding: 22px 28px;      /* 增加內距，讓文字有呼吸空間 */
    border-radius: 25px;     /* 圓角再圓一點，看起來更親切 */
    box-shadow: 0 12px 35px rgba(0,0,0,0.12); /* 陰影再柔和一點 */
    
    max-width: 85%;
    width: 280px;            /* 給一個建議寬度，讓換行更自然 */
    opacity: 0;
    transition: all 0.5s ease; /* 增加過場的平滑度 */
    pointer-events: none;
    z-index: 200;

    /* 🌟 重點排版設定 */
    white-space: pre-line;   /* 讓 JS 裡的 \n 換行符號生效 */
    line-height: 1.8;        /* 拉高行距，避免長句子擠在一起 */
    text-align: center;      /* 文字置中 */
    font-size: 15px;         /* 設定一個舒適的字體大小 */
    border: 1px solid rgba(255,255,255,0.5); /* 淡淡的白邊，模仿玻璃質感 */
}

        /* 天燈 */
        .sky-lantern {
            position: absolute; bottom: -100px; width: 60px; height: 80px;
            background: #ff6b6b; border-radius: 10px 10px 5px 5px;
            animation: flyUp 8s forwards linear; color: white; font-size: 10px; text-align: center; padding: 10px 5px; z-index: 1;
        }
        @keyframes flyUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-120vh) translateX(50px) rotate(10deg); opacity: 0; } }

        /* 控制按鈕 */
        .controls { padding: 10px 20px 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 400px; }
        button { border: none; padding: 12px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:active { transform: translateY(2px); filter: brightness(0.9); }

        /* 彈窗 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { background: white; color: #333; padding: 20px; border-radius: 25px; width: 100%; max-width: 380px; text-align: center; max-height: 90vh; overflow-y: auto; }
        
        .scroll-list { display: grid; grid-template-columns: repeat(1, 1fr); gap: 10px; margin-top: 15px; }
        .album-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .item-card { background: #fdfdfd; padding: 15px; border-radius: 18px; border: 1px solid #f0f0f0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-card img { width: 65px; height: 65px; }
        
        .emotion-input-group { margin: 12px 0; display: flex; align-items: center; }
        .emotion-input-group label { font-size: 14px; width: 70px; text-align: left; }
        input[type=range] { flex: 1; accent-color: var(--primary-green); }
        
        /* 隱藏的檔案選擇器 */
        #import-input { display: none; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 10px; border: 1px solid #ddd; resize: none; font-family: inherit; }
        
        /* 儲存容量進度條專用樣式 */
        .storage-progress-area { background: #f9f9f9; padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: left; border: 1px solid #eee; }
    </style>
    <style>
       /* 🫧 泡泡與樹葉的基礎樣式 */
.pop-item {
    position: fixed;
    font-size: 45px; /* 增大尺寸，讓手機好點擊 */
    cursor: pointer;
    z-index: 9999;  /* 確保在最上層 */
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
    
    /* 讓元素有飄浮動效 */
    animation: bubbleFloat 4s ease-in-out infinite;
    
    /* 讓點擊反應更靈敏 */
    touch-action: manipulation; 
}

/* 💥 點擊破裂特效 (當 JS 加入 .popped 類別時觸發) */
.pop-item.popped {
    transform: scale(2.5); /* 瞬間放大 */
    opacity: 0;           /* 變透明 */
    pointer-events: none; /* 防止重複點擊 */
}

/* ☁️ 飄浮動畫：模擬在空氣中輕微晃動的感覺 */
@keyframes bubbleFloat {
    0%, 100% { 
        transform: translate(0, 0) rotate(0deg); 
    }
    33% { 
        transform: translate(15px, -25px) rotate(8deg); 
    }
    66% { 
        transform: translate(-15px, 15px) rotate(-8deg); 
    }
}

/* 📱 針對小螢幕的微調：如果覺得太大可以縮小一點 */
@media (max-width: 380px) {
    .pop-item {
        font-size: 38px;
    }
}

/* 🌟 背景流動動畫 */
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

body {
    background-size: 400% 400% !important;
    animation: gradientBG 15s ease infinite;
    transition: all 1.5s ease;
}

/* 🎨 五大升級版背景樣式 */
body.theme-morning { 
    background: linear-gradient(45deg, #eacda3, #d6ae7b, #eacda3) !important; 
    /* 這裡使用了更沉穩的米橘與古銅金，模擬日出前那一刻 */
    color: #5d4037; 
}
body.theme-night-study { background: linear-gradient(45deg, #0f2027, #203a43, #2c5364); color: #a5d6a7; }
/* 🌊 星靈海域：從淺藍到深藍，模擬海底光影 */
body.theme-ocean { 
    background: linear-gradient(45deg, #4facfe, #00f2fe, #4facfe) !important; /* 陽光淺海 */
    /* 修正版：更深邃、舒壓的藍色漸層 */
    background: linear-gradient(135deg, #1cb5e0 0%, #000851 100%) !important;
    color: #e0f7fa; 
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
}

/* 讓海洋模式下的泡泡與文字更明顯 */
body.theme-ocean #garden-name,
body.theme-ocean #points-display {
    background: rgba(255, 255, 255, 0.2);
    padding: 2px 8px;
    border-radius: 12px;
}

body.theme-zen { 
    background: linear-gradient(135deg, #d3cbb8 0%, #6d6027 100%) !important;
    /* 備選方案（更深沉的純木質感）： */
    background: linear-gradient(135deg, #8b5a2b 0%, #4a2c2a 100%) !important; 
    color: #f5f5f5; /* 改為淺米色文字，對比更好看 */
}
/* 讓文字在這些背景上更好讀 */

body.theme-cloud { background: linear-gradient(45deg, #89f7fe, #66a6ff, #89f7fe); color: #01579b; }
body.theme-morning #garden-name, 
body.theme-zen #garden-name,
body.theme-zen #points-display {
    background: rgba(255, 255, 255, 0.15); /* 輕微透明感 */
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
}
/* 讓泡泡在深色背景更明顯 */
body.theme-night-study .pop-item { filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }


/* 商店專用樣式 */
.shop-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 15px;
}

.bg-card {
    background: #f9f9f9;
    padding: 15px;
    border-radius: 18px;
    border: 2px solid #eee;
    text-align: center;
    position: relative;
}

.bg-card.owned { border-color: var(--primary-green); }
.bg-card.active { background: #e8f5e9; border-color: #4caf50; }

.bg-preview {
    width: 100%;
    height: 60px;
    border-radius: 10px;
    margin-bottom: 8px;
    border: 1px solid rgba(0,0,0,0.1);
}

.coin-badge {
    background: rgba(0, 0, 0, 0.6); /* 半透明黑色底，確保數字清晰 */
    color: #ffd700;                /* 黃金色的文字，更有代幣感 */
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1.5px solid rgba(255, 215, 0, 0.5); /* 金色半透邊框 */
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3),    /* 外陰影增加立體感 */
                inset 0 0 5px rgba(255, 215, 0, 0.2); /* 內發光 */
    
    /* 讓它固定在畫面某個位置 (選配，若妳已經有排版則不需這段) */
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}

#coin-count {
    color: #ffffff; /* 數字用純白，對比度最高 */
    text-shadow: 0 0 2px #000;
}

/* 隨機小卡背景遮罩 */
#purify-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 3000;
    justify-content: center;
    align-items: center;
    cursor: pointer; /* 讓玩家知道點哪裡都可以關閉 */
}

/* 小卡內容本體 - 優化後的版本 */
.purify-card {
    background: white;
    padding: 15px;      /* 縮小內邊距，把空間讓給拼圖 */
    border-radius: 15px;
    text-align: center;
    width: 90%;         /* 讓卡片在手機上自動伸展 */
    max-width: 320px;    /* 限制電腦版的最大寬度 */
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.2); /* 改深色陰影在白底上比較明顯 */
    cursor: default;
    overflow: hidden;    /* 🌟 重要：防止內容溢出卡片 */
    animation: cardPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    
    /* 讓內容垂直置中 */
    display: flex;
    flex-direction: column;
    align-items: center;
}

.purify-card img {
    max-width: 200px;
    height: auto;
    display: block;
    margin: 0 auto 10px;
}

.purify-card p {
    color: #555;
    font-weight: bold;
    margin: 0;
}

@keyframes cardPop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* 拼圖容器：只設寬度，高度讓它自動跟著圖片比例走 */
#puzzle-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-gap: 2px;
    width: 100%;       /* 🌟 改為 100%，它會填滿 purify-card 的可用寬度 */
    max-width: 260px;  /* 🌟 設定一個手機安全上限 */
    margin: 10px auto;
    background: #eee;
    touch-action: none; /* 🌟 防止手機滑動拼圖時觸發網頁捲動 */
}

/* 拼圖碎片 */
.puzzle-piece {
    width: 100%;
    /* 核心：確保碎片寬高比跟原圖一致 */
    aspect-ratio: auto; 
    background-size: cover; /* 關鍵：讓背景自動填滿但不變形 */
    background-repeat: no-repeat;
    cursor: pointer;
    border-radius: 4px;
}

/* 被選中的碎片效果 */
.puzzle-piece.selected {
    outline: 3px solid #ffd700;
    transform: scale(1.05);
    z-index: 10;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

/* 切換按鈕樣式 */
.puzzle-btn {
    background: #8b5a2b;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 20px;
    margin-top: 10px;
    cursor: pointer;
}

/* 龍貓祈願小卡容器 */
#totoro-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    
    /* 修正 1：設定最大寬度，避免在手機版溢出 */
    width: 250px; 
    max-width: 85vw; 
    
    background: white;
    border-radius: 20px; /* 圓角稍微加大，更有吉卜力風的圓潤感 */
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    padding: 20px;
    text-align: center;
    z-index: 1000; /* 確保層級夠高 */
    
    /* 修正 2：改用較溫暖的邊框顏色 */
    border: 3px solid #a8d5ba; 
    
    display: none; 
    flex-direction: column; /* 確保內容垂直居中 */
    align-items: center;
}

#totoro-card img {
    /* 修正 3：解決不同尺寸 GIF 的核心代碼 */
    width: 100%;
    height: auto;      /* 高度自動，維持原始比例 */
    max-height: 250px; /* 防止過長的 GIF 佔滿螢幕 */
    
    object-fit: contain; /* 確保整張圖完整顯示且不變形 */
    border-radius: 12px;
    background-color: #fcfcfc; /* 比例不合時的微弱底色 */
}

/* 修正 4：美化關閉按鈕（如果有的話）*/
#close-card-btn {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 25px;
    background-color: #78a5a3;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
}

#close-card-btn:hover {
    background-color: #5a8280;
}

/* 當卡片顯示時，背景模糊效果 */
.blur-content {
    filter: blur(8px); /* 增加模糊度，驚喜感更強 */
    pointer-events: none; 
    transition: filter 0.5s ease; /* 增加平滑過渡 */
}

    </style>

    };
// 在常數區定義遊戲時間
const NURTURE_TIME_LIMIT = 10; // 小遊戲持續 10 秒
let miniGameScore = 0;         // 紀錄本次戳破的數量
let spawnTimer = null;      // 用來清除產生器的計時器
    // 2. 狀態初始化 (移至上方)
    let gameState = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        points: 0, gardenLv: 1, plantStatus: 'idle', 
        growStartTime: 0, currentFlowerId: "", currentFlowerName: "", currentFlowerImg: "",
        futureLetters: [], flowerAlbum: [] ,
        coins: 0,                 // 🌟 新增代幣
    currentBg: 'default',      // 🌟 當前背景 ID
    unlockedBgs: ['default']   // 🌟 已擁有的背景
    };

    const BACKGROUNDS = {
    'default': { name: '預設日夜', price: 0, class: '', preview: '#e8f5e9', emojis: [] },
    'morning': { 
        name: '夢幻晨曦', 
        price: 350, 
        class: 'theme-morning', 
        preview: 'linear-gradient(#eacda3, #d6ae7b)', // 較暗的橘

    },

    'ocean': {

        preview: 'linear-gradient(#1cb5e0, #000851)', 
        emojis: ['🐠', '✨', '🫧', '💧'] // 魚群、微光與氣泡
    },

    emojis: ['🍁', '🍵', '🎐', '🎋'] // 加入竹子，更有層次感
},
    'cloud': { name: '雲端之巔', price: 350, class: 'theme-cloud', preview: 'linear-gradient(#89f7fe, #66a6ff)', emojis: ['🌈', '🎈', '☁️'] }
};

    function autoSave() { 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
        if(document.getElementById('save-modal').style.display === 'flex') updateStorageProgress();
    }

    function validateEmotions() {
        const h = parseInt(document.getElementById('emo-happy').value), 
              a = parseInt(document.getElementById('emo-angry').value),
              w = parseInt(document.getElementById('emo-worry').value), 
              s = parseInt(document.getElementById('emo-sad').value),
              hp = parseInt(document.getElementById('emo-hope').value);
        const total = h + a + w + s + hp;
        const display = document.getElementById('total-check');
        display.innerText = `總和: ${total} / 100`;
        display.style.color = (total === 100) ? 'green' : 'red';
        document.getElementById('plant-btn').disabled = (total !== 100);
    }

    function confirmPlanting() {
    // 1. 決定這次會種出什麼（邏輯不變）
    let pool = (gameState.gardenLv < 5) ? ASSETS.flowers : ASSETS.flowers.concat(ASSETS.foods);
    const item = pool[Math.floor(Math.random() * pool.length)];

    gameState.currentFlowerId = item.id; 
    gameState.currentFlowerName = item.name; 
    gameState.currentFlowerImg = item.img;

    // 2. 這裡原本是直接改為 'growing'，現在改為啟動小遊戲
    closeModal(); 
    startNurturingGame(); // 呼叫下方新增的小遊戲函數
}
    function startNurturingGame() {
    gameState.plantStatus = 'nurturing'; // 切換至新狀態
    miniGameScore = 0;
    updateUI();
    showBubble("🫧 快速點擊泡泡與樹葉，幫植物澆水施肥！");

    // 每 450 毫秒產生一個元素
    spawnTimer = setInterval(createPopElement, 450);

    // 10 秒後結束遊戲
    setTimeout(() => {
        clearInterval(spawnTimer);
        finishNurturing();
    }, 10000); 
}

function createPopElement() {
    const el = document.createElement('div');
    el.className = 'pop-item'; // 對應妳 CSS 寫的樣式
    el.innerText = Math.random() > 0.5 ? '🫧' : '🍃';
    
    // 隨機出現在畫面中（避開邊緣）
    el.style.left = (15 + Math.random() * 70) + '%';
    el.style.top = (25 + Math.random() * 45) + '%';
    
    el.onclick = () => {
        miniGameScore++;
        el.classList.add('popped'); // 觸發破裂動畫
        setTimeout(() => el.remove(), 250);
    };

    document.body.appendChild(el);
    // 沒點到 3 秒後自動消失
    setTimeout(() => { if(el.parentNode) el.remove(); }, 3000);
}

function finishNurturing() {
    // 清理殘留泡泡
    document.querySelectorAll('.pop-item').forEach(el => el.remove());
    
    // 獎勵計算：GROWTH_TIME_LIMIT 減去點擊次數，最低剩 3 秒
    const actualWait = Math.max(3, GROWTH_TIME_LIMIT - miniGameScore);
    
    gameState.plantStatus = 'growing'; // 正式進入倒數
    // 透過調整開始時間來實現「剩餘時間變少」的效果
    gameState.growStartTime = Date.now() - (GROWTH_TIME_LIMIT - actualWait) * 1000;
    gameState.coins += miniGameScore;

    showBubble(`✨ 照顧完成！獲得 ${miniGameScore} 養分，倒數縮短了！`);
    updateUI();
    autoSave();
}
        

    function harvest() {
    const isNew = !gameState.flowerAlbum.find(f => f.id === gameState.currentFlowerId);
    if (isNew) {
        gameState.flowerAlbum.push({ 
            id: gameState.currentFlowerId, 
            name: gameState.currentFlowerName, 
            img: gameState.currentFlowerImg 
        });
    }
    
    gameState.points += 2;
    const words = (gameState.gardenLv >= 5) ? WORDS_HIGH : WORDS_LOW;
    const randomQuote = words[Math.floor(Math.random() * words.length)];

    // 🌟 這裡微調了「標點符號」與「空格」，讓層次更美
    const message = isNew 
        ? `🌟 新發現！\n【 ${gameState.currentFlowerName} 】盛開了\n\n「 ${randomQuote} 」`
        : `【 ${gameState.currentFlowerName} 】盛開了\n\n「 ${randomQuote} 」`;

    showBubble(message);
    
    gameState.plantStatus = 'idle';
    checkLevelUp(); 
    updateUI(); 
    autoSave();
}

    function checkLevelUp() {
    const threshold = 20; // 直接改成固定數字
    if (gameState.points >= threshold && gameState.gardenLv < 10) {
        gameState.gardenLv++; 
        gameState.points = 0; // 升級後經驗歸零
        showBubble(`🎊 花園升級了！目前等級：Lv.${gameState.gardenLv}`);
    }
}
    function updateUI() {
    const threshold = 20; 
    const bar = document.getElementById('progress-bar');        
    const pointsDisp = document.getElementById('points-display');
    const nameDisp = document.getElementById('garden-name');
    
    if(bar) bar.style.width = (gameState.points / threshold * 100) + "%";
    if(pointsDisp) pointsDisp.innerText = `${gameState.points} / ${threshold}`;
    if(nameDisp) nameDisp.innerText = `Lv.${gameState.gardenLv} ${gameState.gardenLv >= 5 ? '繁盛花園' : '新手花園'}`;
    
    // --- 🌸 背景商店與裝飾修改開始 ---
    
    // 1. 更新代幣顯示 (記得在 HTML 增加這個 ID)
    const coinCountDisp = document.getElementById('coin-count');
    if (coinCountDisp) coinCountDisp.innerText = gameState.coins || 0;

    // 2. 處理背景樣式
    Object.values(BACKGROUNDS).forEach(bg => { 
        if(bg.class) document.body.classList.remove(bg.class); 
    });
    document.body.classList.remove('day', 'night');

    const currentBgData = BACKGROUNDS[gameState.currentBg];

    // 判斷背景：如果有購買背景就穿背景，沒有就走日夜模式
    if (currentBgData && gameState.currentBg !== 'default') {
        document.body.classList.add(currentBgData.class);
        window.currentRenderMode = gameState.currentBg; 
    } else {
        updateTheme(); // 這會幫 body 加上 'day' 或 'night'
        window.currentRenderMode = document.body.classList.contains('day') ? 'day' : 'night';
    }

    // 3. 處理等級 5 以上的粒子裝飾
    const isHighLevel = gameState.gardenLv >= 5;
    if (isHighLevel) {
        // 當前背景模式變了，才重新產生粒子
        if (window.lastRenderedMode !== window.currentRenderMode) {
            createLvlHighDecorations(); 
            window.lastRenderedMode = window.currentRenderMode;
        }
    } else {
        // 未滿 5 等，清空所有裝飾
        document.querySelectorAll('.decoration-emoji').forEach(d => d.remove());
        window.lastRenderedMode = null;
    }
    
    // --- 🌸 背景商店與裝飾修改結束 ---
    
    // ... 下方原本的植物圖片與提示文字邏輯保持不變 ...
    const img = document.getElementById('flower-img');
const hint = document.getElementById('hint-text');
const flowerNameDisp = document.getElementById('flower-name-display');
const totoroCard = document.getElementById('totoro-card'); 
const totoroGif = document.getElementById('totoro-gif');
const closeBtn = document.getElementById('close-card-btn');

// 先統一重置模糊效果
img.classList.remove('blur-content');
img.style.filter = "none";

if (gameState.plantStatus === 'idle') { 
    img.src = ASSETS.soil; 
    hint.innerText = "點擊土壤播下此刻的心情"; 
    flowerNameDisp.innerText = ""; 
    if(totoroCard) totoroCard.style.display = 'none'; 
} 
else if (gameState.plantStatus === 'nurturing') {
    img.src = ASSETS.sprout; 
    hint.innerText = "✨ 正在細心呵護中... (點擊泡泡！)"; 
    flowerNameDisp.innerText = "給予養分中..."; 
    if(totoroCard) totoroCard.style.display = 'none';
}
else if (gameState.plantStatus === 'growing') { 
    // --- 🌸 整合後的龍貓隨機邏輯 ---
    img.src = ASSETS.sprout; 
    hint.innerText = "情緒正在萌芽中..."; 
    flowerNameDisp.innerText = "培育中..."; 
    img.classList.add('blur-content'); // 使用你 CSS 定義的模糊

    if (totoroCard) {
        // 只有卡片沒顯示時才抽新圖，避免倒數時圖片一直閃
        if (totoroCard.style.display === 'none' || totoroCard.style.display === '') {
            const config = ASSETS.totoroConfig;
            const randomNum = Math.floor(Math.random() * config.count) + 1;
            totoroGif.src = `${config.baseUrl}${randomNum}.gif`;
        }
        totoroCard.style.display = 'flex'; // 建議用 flex 配合居中 CSS
        if(closeBtn) closeBtn.style.display = 'none'; // 成長中不能關閉
    }
} 
else { 
    // 已成熟狀態
    img.src = gameState.currentFlowerImg; 
    hint.innerText = "收成這份心情"; 
    flowerNameDisp.innerText = "已盛開： " + gameState.currentFlowerName; 

    if(totoroCard) {
        // 顯示卡片但亮起關閉按鈕，增加驚喜感
        totoroCard.style.display = 'flex';
        if(closeBtn) {
            closeBtn.style.display = 'block';
            closeBtn.onclick = () => {
                totoroCard.style.display = 'none';
                img.classList.remove('blur-content');
            };
        }
    }
    }
    if (typeof autoSave === 'function') autoSave();
}

    function createLvlHighDecorations() {
    // 1. 先移除舊的裝飾
    const oldDecos = document.querySelectorAll('.decoration-emoji');
    oldDecos.forEach(d => d.remove());

    // 🌟 修正重點：在這裡先定義好基礎狀態，確保後續邏輯都能讀到
    const isDay = document.body.classList.contains('day');
    let bgKey = gameState.currentBg;
    let emojiPool = [];
    let animation = 'sakuraFloat';

    // 2. 獲取當前背景的專屬設定
    if (bgKey === 'default') {
        emojiPool = isDay ? ['🌸'] : ['✨'];
        animation = isDay ? 'sakuraFloat' : 'starBlink';
    } else {
        const bgData = BACKGROUNDS[bgKey];
        emojiPool = bgData.emojis || ['✨'];
        // 判斷該背景是要飄還是要閃
        animation = (bgKey === 'night-study') ? 'starBlink' : 'sakuraFloat';
    }

    const count = 6; 
    const container = document.body;

    for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'decoration-emoji';
        
        // 從該背景的 Emoji 池中隨機抽一個
        span.innerText = emojiPool[Math.floor(Math.random() * emojiPool.length)];

        // 3. 隨機設定位置
        const side = Math.random() > 0.5 ? 'left' : 'right';
        span.style[side] = (Math.random() * 30) + '%';
        span.style.top = (5 + Math.random() * 85) + '%';

        // 4. 隨機設定大小
        span.style.fontSize = (20 + Math.random() * 25) + 'px';

        // 5. 根據背景微調視覺效果 (現在這裡不會報錯了)
        // 5. 根據背景微調視覺效果
// 🌟 將 'ocean' 加入發光判斷中
if (bgKey === 'night-study' || bgKey === 'ocean' ||  bgKey === 'zen' || (!isDay && bgKey === 'default')) {
    // 【深色/發光模式】：深夜、海底
    // 稍微調高基礎透明度 (0.6)，讓海洋生物更明顯
    span.style.opacity = 0.6 + Math.random() * 0.4; 
    // 增加發光範圍到 10px，營造水下折射感
    span.style.filter = `drop-shadow(0 0 10px rgba(255,255,255,0.9))`;
} else {
    // 【明亮/柔和模式】：晨曦、和風、雲端、白天
    span.style.opacity = 0.4 + Math.random() * 0.4;
    const blur = Math.random() * 1.5;
    span.style.filter = `blur(${blur}px)`;
}

        // 6. 動態參數
        const delay = Math.random() * 5;
        const duration = 7 + Math.random() * 5;
        span.style.animation = `${animation} ${duration}s infinite ${delay}s ease-in-out`;

        container.appendChild(span);
    }
    console.log(`✅ 背景【${bgKey}】裝飾已更新。`);
}

function loadGameOnStart() {
    const savedData = localStorage.getItem(STORAGE_KEY);
    if (savedData) {
        try {
            const parsed = JSON.parse(savedData);
            // 同樣使用 Spread Operator 確保新舊欄位並存
            gameState = { ...gameState, ...parsed };
            console.log("✅ 已自動載入本地進度");
        } catch(e) {
            console.error("載入存檔失敗", e);
        }
    }
}
        // --- 同步修改：init 函數，確保重新調整視窗大小時裝飾位置正確 (選做，增加穩定性) ---
        function init() {
        loadGameOnStart();
    // 1. 優先套用背景（如果有買背景，就不走預設日夜）
    updateUI(); 
    
    // 2. 設定定時器
    setInterval(checkGrowth, 1000); // 每秒檢查植物成長
    
    // 🌟 修改：只有在「預設背景」模式下，才需要每分鐘檢查日夜切換
    setInterval(() => {
        if (gameState.currentBg === 'default') {
            updateTheme();
            updateUI(); // 確保日夜切換後，裝飾物（櫻花/星星）也會跟著換
        }
    }, 60000);
    
    // 3. 視窗縮放處理
    window.addEventListener('resize', () => {
        if (gameState.gardenLv >= 5) {
            // 🌟 這裡改成直接呼叫，不傳參數
            createLvlHighDecorations(); 
        }
    });

    console.log("🌱 花園系統已啟動：", gameState.currentBg);
}

    function checkGrowth() {
        if (gameState.plantStatus === 'growing') {
            const elapsed = Math.floor((Date.now() - gameState.growStartTime) / 1000);
            const timerDisp = document.getElementById('growth-timer');
            if (elapsed >= GROWTH_TIME_LIMIT) { 
                gameState.plantStatus = 'ready'; 
                if(timerDisp) timerDisp.innerText = ""; 
                updateUI(); 
            } else {
                if(timerDisp) timerDisp.innerText = `收成倒數 ${GROWTH_TIME_LIMIT - elapsed}s`;
            }
        }
    }


    function openShop() {
    const container = document.getElementById('shop-container');
    if (!container) return;
    
    container.innerHTML = ""; // 清空舊內容
    
    Object.keys(BACKGROUNDS).forEach(id => {
        const bg = BACKGROUNDS[id];
        const isUnlocked = gameState.unlockedBgs.includes(id);
        const isActive = gameState.currentBg === id;
        
        const card = document.createElement('div');
        card.className = `bg-card ${isUnlocked ? 'owned' : ''} ${isActive ? 'active' : ''}`;
        
        // 根據狀態決定按鈕文字與顏色
        let btnText = isUnlocked ? (isActive ? '使用中' : '切換') : `💰 ${bg.price}`;
        let btnColor = isUnlocked ? (isActive ? '#81c784' : '#64b5f6') : '#ffb74d';

        card.innerHTML = `
            <div class="bg-preview" style="background: ${bg.preview}"></div>
            <div style="font-size:14px; font-weight:bold; margin-bottom:4px;">${bg.name}</div>
            <button onclick="handleShopAction('${id}')" 
                style="border:none; border-radius:10px; padding:8px; width:100%; background:${btnColor}; color:white; font-weight:bold; cursor:pointer;">
                ${btnText}
            </button>
        `;
        container.appendChild(card);
    });
    
    document.getElementById('shop-modal').style.display = 'flex';
}

function handleShopAction(id) {
    const bg = BACKGROUNDS[id];
    
    if (gameState.unlockedBgs.includes(id)) {
        gameState.currentBg = id;
        closeModal(); // 🌟 成功切換就先關閉商店，讓玩家看到背景
        showBubble(`✨ 已切換至【${bg.name}】風景`);
    } 
    else {
        if (gameState.coins >= bg.price) {
            gameState.coins -= bg.price;
            gameState.unlockedBgs.push(id);
            gameState.currentBg = id;
            closeModal(); // 🌟 成功購買也先關閉商店
            showBubble(`🎊 成功解鎖！換上【${bg.name}】`);
        } else {
            const need = bg.price - gameState.coins;
            showBubble(`代幣還差 ${need} 枚，\n再玩幾次小遊戲吧！🫧`);
            // 代幣不足時不呼叫 closeModal，讓玩家留在商店介面
            return; 
        }
    }
    
    updateUI();
    autoSave();
}




    // --- 系統功能 ---
    function updateStorageProgress() {
        const limit = 5120;
        let total = 0;
        try {
            for (let x in localStorage) {
                if (!localStorage.hasOwnProperty(x)) continue;
                total += ((localStorage[x].length + x.length) * 2) / 1024;
            }
        } catch(e) { total = 0; }
        
        const percentage = Math.min((total / limit) * 100, 100).toFixed(1);
        const bar = document.getElementById('storage-bar');
        if(bar) {
            bar.style.width = percentage + "%";
            bar.style.background = percentage > 80 ? '#f44336' : '#4caf50';
            document.getElementById('storage-usage-text').innerText = percentage + "%";
            document.getElementById('storage-kb-info').innerText = `已使用: ${total.toFixed(1)} KB / ${limit} KB`;
        }
    }

    function exportSaveFile() {
        const dataStr = JSON.stringify(gameState, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `garden_backup_${new Date().toLocaleDateString()}.json`;
        link.click();
        showBubble("存檔已匯出。");
    }

    function importSaveFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            
            // 檢查是否為有效存檔 (至少要有等級)
            if (imported && imported.gardenLv !== undefined) {
                
                // 🌟 關鍵修改：合併新舊資料
                // 先拿目前程式碼中定義的「完整預設值」當底
                // 再把「匯入的舊資料」覆蓋進去
                // 這樣就算舊存檔沒錢、沒背景，也會維持新版的預設值 (0元、default)
                gameState = { ...gameState, ...imported };
                
                autoSave();
                alert("進度匯入成功！即將重新載入...");
                location.reload();
            } else {
                alert("存檔格式不正確。");
            }
        } catch (err) { 
            alert("讀取失敗，請檢查檔案格式。"); 
        }
    };
    reader.readAsText(file);
}

    function clearData() { if(confirm("確定要重置嗎？")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }
    function handlePlantClick() { if (gameState.plantStatus === 'ready') harvest(); else if (gameState.plantStatus === 'idle') openPlantModal(); }
    function openPlantModal() { if (gameState.plantStatus === 'idle') { document.getElementById('plant-modal').style.display = 'flex'; validateEmotions(); } else showBubble("有一顆心靈正在萌芽..."); }
    function closeModal() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
    function openSaveMenu() { updateStorageProgress(); document.getElementById('save-modal').style.display = 'flex'; }
    function updateTheme() {
    // 只有在玩家使用「預設日夜」模式時，才執行自動切換
    if (gameState.currentBg !== 'default') return;

    const hr = new Date().getHours();
    const isDay = (hr >= 6 && hr < 18); // 建議用 >= 6 包含早上六點

    // 🌟 使用 classList 確保不會蓋掉其他 class
    document.body.classList.toggle('day', isDay);
    document.body.classList.toggle('night', !isDay);
    
    console.log(`🌙 系統自動切換至：${isDay ? '日間' : '夜間'}模式`);
}
    function showBubble(text) { const b = document.getElementById('message-bubble'); if(b) { b.innerText = text; b.style.opacity = 1; setTimeout(() => b.style.opacity = 0, 5000); } }
    function triggerImport() { document.getElementById('import-input').click(); }

    // --- 圖鑑與天燈邏輯 ---
    function toggleAlbum() {

    // 🌟 在 launchLantern 內部的 else (非 future) 加入此函數
function showRandomPurifyCard() {
    const modal = document.getElementById('purify-modal');
    const imgElement = document.getElementById('purify-img');
    
    // 1. 隨機產生 1~12 的數字
    const randomNum = Math.floor(Math.random() * 24) + 1;
    
    // 2. 組合 GitHub 圖片網址
    const imgUrl = `https://raw.githubusercontent.com/paulie0102-Bear/garden/refs/heads/main/${randomNum}.png`;

let firstPiece = null; // 紀錄第一次點擊的碎片

function startPuzzle() {
    const img = document.getElementById('purify-img');
    const board = document.getElementById('puzzle-board');
    const btn = document.getElementById('puzzle-switch-btn');
    
    // 1. 先顯示容器，我們才量得到它在手機畫面上的「實際寬度」
    img.style.display = 'none';
    board.style.display = 'grid';
    btn.style.display = 'none';

    // 2. 🌟 關鍵改動：自動測量寬度（取代原本的 280）
    const boardWidth = board.clientWidth; 
    
    // 3. 獲取原圖比例
    const imgW = img.naturalWidth;
    const imgH = img.naturalHeight;
    const ratio = imgH / imgW; 

    const imgSrc = img.src;
    board.innerHTML = ''; // 清空舊拼圖
    
    // 4. 建立並打亂碎片
    let pieces = [...Array(9).keys()];
    pieces.sort(() => Math.random() - 0.5);

    pieces.forEach((pos, index) => {
        const piece = document.createElement('div');
        piece.className = 'puzzle-piece';
        piece.dataset.correctPos = pos;
        
        // 5. 根據量出來的 boardWidth 動態計算
        const pieceWidth = boardWidth / 3;
        const pieceHeight = pieceWidth * ratio;
        
        piece.style.height = `${pieceHeight}px`;
        piece.style.backgroundImage = `url(${imgSrc})`;
        
        // 背景大小要撐滿整個拼圖板
        piece.style.backgroundSize = `${boardWidth}px ${boardWidth * ratio}px`;
        
        // 計算該碎片對應的背景位置
        const row = Math.floor(pos / 3);
        const col = pos % 3;
        piece.style.backgroundPosition = `-${col * pieceWidth}px -${row * pieceHeight}px`;
        
        piece.onclick = () => handlePieceClick(piece);
        board.appendChild(piece);
    });
    
    document.getElementById('purify-msg').innerText = "動手修復這份心情吧！";
}

function handlePieceClick(piece) {
    if (!firstPiece) {
        // 第一次點擊
        firstPiece = piece;
        piece.classList.add('selected');
    } else {
        // 第二次點擊，進行交換
        const secondPiece = piece;
        if (firstPiece === secondPiece) {
            firstPiece.classList.remove('selected');
            firstPiece = null;
            return;
        }

        // 交換背景與正確位置標記
        const tempBG = firstPiece.style.backgroundPosition;
        const tempPos = firstPiece.dataset.correctPos;

        firstPiece.style.backgroundPosition = secondPiece.style.backgroundPosition;
        firstPiece.dataset.correctPos = secondPiece.dataset.correctPos;

        secondPiece.style.backgroundPosition = tempBG;
        secondPiece.dataset.correctPos = tempPos;

        // 清除選取狀態
        firstPiece.classList.remove('selected');
        firstPiece = null;

        checkWin();
    }
}

function checkWin() {
    const allPieces = document.querySelectorAll('.puzzle-piece');
    const board = document.getElementById('puzzle-board');
    
    // 檢查每個碎片目前的 backgroundPosition 是否回到對的位置
    let isWin = true;
    allPieces.forEach((p, index) => {
        const currentPos = parseInt(p.dataset.correctPos);
        if (currentPos !== index) isWin = false;
    });

    if (isWin) {
        document.getElementById('purify-msg').innerText = "✨ 完美修復！煩惱徹底消散了 ✨";
        allPieces.forEach(p => p.style.outline = "none");
        // 增加一點點獎勵
        if(typeof gameState !== 'undefined') {
            gameState.coins += 5;
            autoSave();
        }
    }
}

// 關閉 Modal 時重置狀態
function closePurifyModal() {
    document.getElementById('purify-modal').style.display = 'none';
    // 重置為初始狀態
    document.getElementById('purify-img').style.display = 'block';
    document.getElementById('puzzle-board').style.display = 'none';
    document.getElementById('puzzle-switch-btn').style.display = 'inline-block';
    document.getElementById('purify-msg').innerText = "煩惱已經被淨化囉！";
    if(firstPiece) firstPiece.classList.remove('selected');
    firstPiece = null;
}

// 🌟 修改妳原本的 launchLantern 函數
function launchLantern() { 
    const textInput = document.getElementById('lantern-text');
    const text = textInput.value; 
    if(!text) return; 

    if (currentLanternMode === 'future') {
        gameState.futureLetters.push({ 
            id: Date.now(), 
            content: text, 
            date: document.getElementById('lantern-date').value, 
            timestamp: new Date().toLocaleDateString() 
        }); 
    } else {
        // --- 🌟 觸發隨機小卡 ---
        showRandomPurifyCard();
    }

    // 產生飛行天燈的邏輯... (保持不變)
    const lan = document.createElement('div'); 
    lan.className = 'sky-lantern'; 
    lan.innerText = text.substring(0,5)+'...'; 
    if(currentLanternMode === 'worry') lan.style.background = '#90a4ae'; 
    document.getElementById('game-container').appendChild(lan); 
    
    closeModal(); 
    textInput.value = ''; 
    autoSave(); 
    setTimeout(() => lan.remove(), 8000); 
}

    function toggleLetters() { 
        const container = document.getElementById('list-container'); 
        document.getElementById('list-title').innerText = "往日信箱"; 
        container.className = "scroll-list"; 
        container.innerHTML = gameState.futureLetters.length === 0 ? "<p>信箱空空的...</p>" : ""; 
        
        gameState.futureLetters.forEach(l => { 
            const isReady = l.date <= new Date().toISOString().split('T')[0]; 
            const card = document.createElement('div'); 
            card.className = 'item-card'; 
            
            // 🌟 重點：如果時間到了，顯示「開啟回憶」按鈕，否則顯示倒數
            const contentHtml = isReady ? 
                `<p style="cursor:pointer; color:#2e7d32; font-weight:bold; margin:10px 0; text-decoration:underline;" 
                    onclick="showTimeCapsule('${l.content.replace(/'/g, "\\'")}')">📖 開啟時光膠囊</p>` : 
                `<p style="color:#999; margin:10px 0;">⏳ 傳送中 (預計 ${l.date} 抵達)</p>`;

            card.innerHTML = `
                <p style='font-size:10px; color:#999'>${l.timestamp} 寄出</p>
                ${contentHtml}
                <button onclick='deleteLetter(${l.id})' style='font-size:10px; background:#ff8a80; color:white; border:none; padding:3px 8px; border-radius:5px;'>刪除</button>
            `; 
            container.appendChild(card); 
        }); 
        document.getElementById('list-modal').style.display = 'flex'; 
    }

    function deleteLetter(id) { if(confirm("確定刪除？")) { gameState.futureLetters = gameState.futureLetters.filter(l => l.id !== id); autoSave(); toggleLetters(); } }

    init();

function showTimeCapsule(contentText) {
    // 建立膠囊遮罩
    const overlay = document.createElement('div');
    overlay.id = 'capsule-overlay';
    overlay.style = `
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); display: flex; align-items: center;
        justify-content: center; z-index: 1000; backdrop-filter: blur(8px);
        opacity: 0; transition: opacity 0.5s;
    `;

    // 膠囊本體
    const content = document.createElement('div');
    content.style = `
        background: #fff9e6; padding: 40px 30px; border-radius: 30px;
        width: 85%; max-width: 400px; text-align: center;
        box-shadow: 0 0 30px rgba(255,215,0,0.3); transform: scale(0.8);
        transition: transform 0.5s; border: 3px solid #d4af37; position: relative;
    `;

    content.innerHTML = `
        <div style="font-size: 50px; margin-bottom: 20px;">✉️</div>
        <h3 style="color: #8b4513; margin: 0 0 15px 0; font-size: 22px;">時光膠囊啟封</h3>
        <div style="color: #5d4037; line-height: 1.8; font-size: 16px; min-height: 100px; display: flex; align-items: center; justify-content: center; border-top: 1px solid #eee; border-bottom: 1px solid #eee; margin: 15px 0; padding: 15px 0;">
            "${contentText}"
        </div>
        <button onclick="document.getElementById('capsule-overlay').remove()" 
                style="margin-top: 20px; padding: 12px 40px; background: #81c784; 
                color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                收好這份回憶
        </button>
    `;

    overlay.appendChild(content);
    document.body.appendChild(overlay);

    // 啟動進場動畫
    setTimeout(() => {
        overlay.style.opacity = '1';
        content.style.transform = 'scale(1)';
    }, 10);
}
